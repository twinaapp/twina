name: Setup
description: Install Go, Node, the wails3 CLI (matching go.mod) and Linux GTK/WebKit headers.

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum

    - uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev

    - id: wails
      shell: bash
      run: |
        echo "version=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)" >> "$GITHUB_OUTPUT"
        echo "bin=$(go env GOPATH)/bin" >> "$GITHUB_OUTPUT"
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

    - id: wails-cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.wails.outputs.bin }}/wails3*
        key: wails3-${{ runner.os }}-${{ runner.arch }}-${{ steps.wails.outputs.version }}

    - name: Install wails3
      if: steps.wails-cache.outputs.cache-hit != 'true'
      shell: bash
      run: go install "github.com/wailsapp/wails/v3/cmd/wails3@${{ steps.wails.outputs.version }}"
