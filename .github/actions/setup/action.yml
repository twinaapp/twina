name: Setup
description: Install Go, Node, the wails3 CLI (matching go.mod) and Linux GTK/WebKit headers.

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum

    - uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev

    - name: Install wails3
      shell: bash
      run: |
        version=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
        go install "github.com/wailsapp/wails/v3/cmd/wails3@$version"
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
